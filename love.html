<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Я Люблю Дайнэру</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .center-text {
    position: fixed;
    z-index: 10;
    text-align: center;
    pointer-events: none;
    animation: fadeIn 3s ease forwards;
  }

  .center-text h1 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(2rem, 5.5vw, 4rem);
    color: #fff;
    letter-spacing: 0.08em;
    animation: glowPulse 4s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% {
      text-shadow:
        0 0 18px rgba(255, 100, 140, 0.8),
        0 0 50px rgba(255, 60, 100, 0.4),
        0 0 100px rgba(255, 30, 80, 0.2);
    }
    50% {
      text-shadow:
        0 0 28px rgba(255, 130, 165, 1),
        0 0 75px rgba(255, 90, 130, 0.65),
        0 0 150px rgba(255, 60, 110, 0.4);
    }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to   { opacity: 1; transform: scale(1); }
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
    z-index: 5;
  }

  canvas#scene {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="center-text">
  <h1>Я Люблю Дайнэру</h1>
</div>

<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function drawHeart(ctx, r) {
  ctx.beginPath();
  const steps = 120;
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    const x =  r * 16 * Math.pow(Math.sin(t), 3) / 16;
    const y = -r * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) / 16;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

class Heart {
  constructor(preplace) {
    this.init(preplace);
  }

  init(preplace) {
    // depth 0=far, 1=close
    this.depth = Math.random();

    // Always spawn from the bottom, random x across full width
    this.x     = Math.random() * canvas.width;
    this.y     = canvas.height + 50 + Math.random() * 80;

    // If pre-placing at start, scatter vertically so screen isn't empty
    if (preplace) {
      this.y = canvas.height * 0.1 + Math.random() * canvas.height * 1.1;
    }

    // Size: far=small, close=large
    this.r = 5 + this.depth * 26;

    // Speed: far=slow, close=fast (pixels per frame)
    this.speed = 0.3 + this.depth * 1.2;

    // Gentle horizontal sway
    this.swayAmp   = 10 + this.depth * 20;
    this.swaySpeed = 0.007 + Math.random() * 0.010;
    this.swayOff   = Math.random() * Math.PI * 2;

    // Max opacity: far=faint, close=vivid
    this.maxOpacity = 0.10 + this.depth * 0.78;

    // Travel distance for a full cycle (far hearts travel less before fading)
    this.travelMax = canvas.height * (0.55 + this.depth * 0.45);
    this.traveled  = 0;

    // Colour — soft pinks for far, deeper reds for close
    const hue = 342 + this.depth * 12;
    const sat = 50  + this.depth * 38;
    const lig = 56  - this.depth * 14;
    this.hue = hue; this.sat = sat; this.lig = lig;
    this.color = `hsl(${hue},${sat}%,${lig}%)`;

    // Blur: far hearts slightly soft
    this.blur = (1 - this.depth) * 2.2;

    // Slight rotation drift
    this.rot      = (Math.random() - 0.5) * 0.25;
    this.rotSpeed = (Math.random() - 0.5) * 0.002;
  }

  update() {
    this.y        -= this.speed;
    this.traveled += this.speed;
    this.x        += Math.sin(this.traveled * this.swaySpeed + this.swayOff) * 0.4;
    this.rot      += this.rotSpeed;

    // Opacity: fade in over first 18%, hold, fade out over last 30%
    const t       = Math.min(this.traveled / this.travelMax, 1);
    const fadeIn  = Math.min(t / 0.18, 1);
    const fadeOut = t > 0.70 ? Math.max(0, 1 - (t - 0.70) / 0.30) : 1;
    this.opacity  = this.maxOpacity * fadeIn * fadeOut;

    // Reset when fully gone or off top
    if (t >= 1 || this.y < -60) {
      this.init(false);
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);

    if (this.blur > 0.4) ctx.filter = `blur(${this.blur.toFixed(1)}px)`;

    // Soft outer glow
    const gr = this.r * 2.2;
    const grd = ctx.createRadialGradient(0, 0, this.r * 0.1, 0, 0, gr);
    grd.addColorStop(0,   `hsla(${this.hue},${this.sat+10}%,${this.lig+14}%,${this.opacity * 0.55})`);
    grd.addColorStop(0.5, `hsla(${this.hue},${this.sat}%,${this.lig}%,${this.opacity * 0.12})`);
    grd.addColorStop(1,   'rgba(0,0,0,0)');
    drawHeart(ctx, gr);
    ctx.fillStyle = grd;
    ctx.fill();

    // Heart body
    ctx.globalAlpha = this.opacity;
    drawHeart(ctx, this.r);
    ctx.fillStyle = this.color;
    ctx.fill();

    // Soft inner highlight
    drawHeart(ctx, this.r);
    const hi = ctx.createRadialGradient(-this.r*0.12, -this.r*0.18, 0, 0, 0, this.r);
    hi.addColorStop(0,   `rgba(255,210,225,${this.opacity * 0.6})`);
    hi.addColorStop(0.45,`rgba(255,130,160,${this.opacity * 0.08})`);
    hi.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = hi;
    ctx.globalAlpha = 1;
    ctx.fill();

    ctx.filter = 'none';
    ctx.restore();
  }
}

const HEART_COUNT = 55;
const hearts = [];

for (let i = 0; i < HEART_COUNT; i++) {
  hearts.push(new Heart(true));
}

// Painter's algo: draw far first
hearts.sort((a, b) => a.depth - b.depth);

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  hearts.sort((a, b) => a.depth - b.depth);
  for (const h of hearts) {
    h.update();
    h.draw(ctx);
  }
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
